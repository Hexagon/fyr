name: Stable Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version tag (for example v0.4.1)"
        required: true
        type: string

jobs:
  preflight:
    name: Stable Preflight
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release_tag.outputs.tag }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve Release Tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid version format: $TAG"
              exit 1
            fi
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure Commit Is On Main
        shell: bash
        run: |
          git fetch origin main
          if ! git branch -r --contains "$GITHUB_SHA" | grep -q "origin/main"; then
            echo "Stable release is only allowed from commits reachable from main."
            exit 1
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Test (workspace)
        run: cargo test --workspace --all-targets

      - name: Cargo Check (server)
        run: cargo check -p server

      - name: Setup Node (frontend)
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: crates/ui/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: crates/ui/frontend
        run: npm ci

      - name: Build Frontend
        working-directory: crates/ui/frontend
        run: npm run build

      - name: Setup Node (docs)
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/build/package-lock.json

      - name: Install Docs Dependencies
        working-directory: docs/build
        run: npm ci

      - name: Build Docs
        working-directory: docs/build
        run: npm run build

  build-stable-image:
    name: Build Stable ${{ matrix.name }} Image
    runs-on: ${{ matrix.runner }}
    needs: preflight
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - name: amd64-avx2
            runner: ubuntu-latest
            platform: linux/amd64
            build_args: "RUST_TARGET_FEATURES=+avx2,+fma"
            cache_scope: fyr-docker-amd64-avx2
          - name: arm64-dotprod
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            build_args: "RUST_TARGET_FEATURES=+dotprod"
            cache_scope: fyr-docker-arm64-dotprod
          - name: pc-legacy
            runner: ubuntu-latest
            platform: linux/amd64
            build_args: ""
            cache_scope: fyr-docker-pc-legacy
          - name: rpi-legacy
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            build_args: ""
            cache_scope: fyr-docker-rpi-legacy
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Stable ${{ matrix.name }} Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
          tags: |
            hexagon/fyr:${{ needs.preflight.outputs.tag }}-${{ matrix.name }}

  publish-stable-manifests:
    name: Publish Stable Manifests
    runs-on: ubuntu-latest
    needs:
      - preflight
      - build-stable-image
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish Stable Optimized Multi-Arch Manifests
        run: |
          docker buildx imagetools create \
            -t hexagon/fyr:${{ needs.preflight.outputs.tag }} \
            -t hexagon/fyr:latest \
            hexagon/fyr:${{ needs.preflight.outputs.tag }}-amd64-avx2 \
            hexagon/fyr:${{ needs.preflight.outputs.tag }}-arm64-dotprod

      - name: Publish Stable Legacy Multi-Arch Manifests
        run: |
          docker buildx imagetools create \
            -t hexagon/fyr:${{ needs.preflight.outputs.tag }}-legacy \
            -t hexagon/fyr:legacy \
            hexagon/fyr:${{ needs.preflight.outputs.tag }}-pc-legacy \
            hexagon/fyr:${{ needs.preflight.outputs.tag }}-rpi-legacy

      - name: Add per-variant stable tags (pc-legacy, rpi-legacy)
        run: |
          docker buildx imagetools create \
            -t hexagon/fyr:pc-legacy \
            hexagon/fyr:${{ needs.preflight.outputs.tag }}-pc-legacy
          docker buildx imagetools create \
            -t hexagon/fyr:rpi-legacy \
            hexagon/fyr:${{ needs.preflight.outputs.tag }}-rpi-legacy

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          generate_release_notes: true
