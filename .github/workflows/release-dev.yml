name: Dev Release

on:
  pull_request:
    types:
      - closed
    branches:
      - dev
  workflow_dispatch:

jobs:
  preflight:
    name: Dev Preflight
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Test (workspace)
        run: cargo test --workspace --all-targets

      - name: Cargo Check (server)
        run: cargo check -p server

      - name: Setup Node (frontend)
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: crates/ui/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: crates/ui/frontend
        run: npm ci

      - name: Build Frontend
        working-directory: crates/ui/frontend
        run: npm run build

      - name: Setup Node (docs)
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/build/package-lock.json

      - name: Install Docs Dependencies
        working-directory: docs/build
        run: npm ci

      - name: Build Docs
        working-directory: docs/build
        run: npm run build

  publish-dev-image:
    name: Publish Dev Docker Image
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    needs: preflight
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Dev amd64 AVX2/FMA Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            RUST_TARGET_FEATURES=+avx2,+fma
          cache-from: type=gha,scope=fyr-docker-dev-amd64-avx2
          cache-to: type=gha,mode=max,scope=fyr-docker-dev-amd64-avx2
          tags: |
            hexagon/fyr:dev-amd64-avx2
            hexagon/fyr:dev-${{ github.sha }}-amd64-avx2

      - name: Build and Push Dev arm64 dotprod Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/arm64
          build-args: |
            RUST_TARGET_FEATURES=+dotprod
          cache-from: type=gha,scope=fyr-docker-dev-arm64-dotprod
          cache-to: type=gha,mode=max,scope=fyr-docker-dev-arm64-dotprod
          tags: |
            hexagon/fyr:dev-arm64-dotprod
            hexagon/fyr:dev-${{ github.sha }}-arm64-dotprod

      - name: Build and Push Dev pc legacy Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          cache-from: type=gha,scope=fyr-docker-dev-pc-legacy
          cache-to: type=gha,mode=max,scope=fyr-docker-dev-pc-legacy
          tags: |
            hexagon/fyr:dev-pc-legacy
            hexagon/fyr:dev-${{ github.sha }}-pc-legacy

      - name: Build and Push Dev rpi legacy Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/arm64
          cache-from: type=gha,scope=fyr-docker-dev-rpi-legacy
          cache-to: type=gha,mode=max,scope=fyr-docker-dev-rpi-legacy
          tags: |
            hexagon/fyr:dev-rpi-legacy
            hexagon/fyr:dev-${{ github.sha }}-rpi-legacy

      - name: Publish Dev Optimized Multi-Arch Manifests
        run: |
          docker buildx imagetools create \
            -t hexagon/fyr:dev \
            -t hexagon/fyr:dev-${{ github.sha }} \
            hexagon/fyr:dev-${{ github.sha }}-amd64-avx2 \
            hexagon/fyr:dev-${{ github.sha }}-arm64-dotprod

      - name: Publish Dev Legacy Multi-Arch Manifests
        run: |
          docker buildx imagetools create \
            -t hexagon/fyr:dev-legacy \
            -t hexagon/fyr:dev-${{ github.sha }}-legacy \
            hexagon/fyr:dev-${{ github.sha }}-pc-legacy \
            hexagon/fyr:dev-${{ github.sha }}-rpi-legacy
