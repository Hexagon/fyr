name: Dev Release

on:
  pull_request:
    types:
      - closed
    branches:
      - dev
  workflow_dispatch:

jobs:
  preflight:
    name: Dev Preflight
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Test (workspace)
        run: cargo test --workspace --all-targets

      - name: Cargo Check (server)
        run: cargo check -p server

      - name: Setup Node (frontend)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: crates/ui/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: crates/ui/frontend
        run: npm ci

      - name: Build Frontend
        working-directory: crates/ui/frontend
        run: npm run build

      - name: Setup Node (docs)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/build/package-lock.json

      - name: Install Docs Dependencies
        working-directory: docs/build
        run: npm ci

      - name: Build Docs
        working-directory: docs/build
        run: npm run build

  build-dev-image:
    name: Build Dev ${{ matrix.name }} Image
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ${{ matrix.runner }}
    needs: preflight
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - name: amd64-avx2
            runner: ubuntu-latest
            platform: linux/amd64
            build_args: "RUST_TARGET_FEATURES=+avx2,+fma"
            cache_scope: fyr-docker-dev-amd64-avx2
          - name: arm64-dotprod
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            build_args: "RUST_TARGET_FEATURES=+dotprod"
            cache_scope: fyr-docker-dev-arm64-dotprod
          - name: pc-legacy
            runner: ubuntu-latest
            platform: linux/amd64
            build_args: ""
            cache_scope: fyr-docker-dev-pc-legacy
          - name: rpi-legacy
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            build_args: ""
            cache_scope: fyr-docker-dev-rpi-legacy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Dev ${{ matrix.name }} Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
          tags: |
            hexagon/fyr:dev-${{ matrix.name }}
            hexagon/fyr:dev-${{ github.sha }}-${{ matrix.name }}

  publish-dev-manifests:
    name: Publish Dev Manifests
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    needs: build-dev-image
    permissions:
      contents: read
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish Dev Optimized Multi-Arch Manifests
        run: |
          docker buildx imagetools create \
            -t hexagon/fyr:dev \
            -t hexagon/fyr:dev-${{ github.sha }} \
            hexagon/fyr:dev-${{ github.sha }}-amd64-avx2 \
            hexagon/fyr:dev-${{ github.sha }}-arm64-dotprod

      - name: Publish Dev Legacy Multi-Arch Manifests
        run: |
          docker buildx imagetools create \
            -t hexagon/fyr:dev-legacy \
            -t hexagon/fyr:dev-${{ github.sha }}-legacy \
            hexagon/fyr:dev-${{ github.sha }}-pc-legacy \
            hexagon/fyr:dev-${{ github.sha }}-rpi-legacy
