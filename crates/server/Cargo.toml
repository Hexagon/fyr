[package]
name = "server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
types = { path = "../types" }
downloader = { path = "../downloader" }
tower = { workspace = true, features = ["util"] }

tokio.workspace = true
axum = { workspace = true, features = ["multipart"] }
serde.workspace = true
serde_json.workspace = true
tower-http = { workspace = true, features = ["set-header"] }
tracing.workspace = true
tracing-subscriber.workspace = true
walkdir.workspace = true
anyhow.workspace = true
thiserror.workspace = true
uuid.workspace = true
tokio-stream.workspace = true
candle-core.workspace = true
candle-nn.workspace = true
candle-transformers.workspace = true
tokenizers = "0.22"
zim = "0.5"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
rusqlite = { version = "=0.39.0", features = ["bundled", "hooks"] }

chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
memmap2 = "0.9"
ring.workspace = true
hex.workspace = true
md-5.workspace = true
digest.workspace = true
aes.workspace = true
cbc.workspace = true
base64 = "0.21"
unicode-normalization = "0.1"
# Place index: gzip/zstd vector tiles (both already in the dependency tree
# via zip and zim).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
zstd = { version = "0.13", default-features = false }
# Built-in HTTPS: rustls with the ring provider (no OpenSSL / aws-lc build),
# axum-server for TLS accept + graceful shutdown, rcgen for self-signed certs.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
if-addrs = "0.13"
time = "0.3"
axum-server = { version = "0.7.2", default-features = false, features = ["tls-rustls-no-provider"] }
libc = "0.2"

[[bin]]
name = "fyr"
path = "src/main.rs"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots", "json"] }
